<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>
</head>

<body>

    <h2>Reset Password</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>New Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</body>

</html>
