<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Automated Invoice System</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">


    <!-- ================= RESET CARD ================= -->

    <div class="w-full max-w-md">


        <!-- Logo / Brand -->

        <div class="text-center mb-6">


            <div class="w-14 h-14 mx-auto bg-blue-600
                        text-white rounded-xl
                        flex items-center justify-center
                        text-2xl font-bold shadow">

                ₹

            </div>


            <h1 class="text-2xl font-bold text-gray-800 mt-4">

                Automated Invoice

            </h1>


            <p class="text-sm text-gray-500 mt-1">

                Secure Invoice Management System

            </p>


        </div>


        <!-- ================= CARD ================= -->

        <div class="bg-white rounded-2xl shadow-lg border
                    p-6 sm:p-8">


            <!-- Header -->

            <div class="text-center mb-7">


                <div class="w-12 h-12 mx-auto bg-blue-100
                            text-blue-600 rounded-xl
                            flex items-center justify-center
                            text-xl">

                    🔐

                </div>


                <h2 class="text-2xl font-bold text-gray-800 mt-4">

                    Reset Password

                </h2>


                <p class="text-sm text-gray-500 mt-2">

                    Create a new password for your account.

                </p>


            </div>


            <!-- ================= ERROR ================= -->

            {% if error %}

            <div class="mb-5 bg-red-50 border border-red-200
                        text-red-700 px-4 py-3 rounded-lg
                        text-sm">

                <div class="flex items-start gap-2">

                    <span>⚠️</span>

                    <p>{{ error }}</p>

                </div>

            </div>

            {% endif %}


            <!-- ================= FORM ================= -->

            <form method="POST" onsubmit="return validatePasswords()">


                <!-- New Password -->

                <div class="mb-5">


                    <label
                        for="password"
                        class="block text-sm font-semibold
                               text-gray-700 mb-2"
                    >

                        New Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                        class="w-full px-4 py-3 border
                               border-gray-300 rounded-lg
                               outline-none transition
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500"
                    >


                    <p class="text-xs text-gray-400 mt-2">

                        Use at least 8 characters.

                    </p>


                </div>


                <!-- Confirm Password -->

                <div class="mb-5">


                    <label
                        for="confirm_password"
                        class="block text-sm font-semibold
                               text-gray-700 mb-2"
                    >

                        Confirm Password

                    </label>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                        class="w-full px-4 py-3 border
                               border-gray-300 rounded-lg
                               outline-none transition
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500"
                    >


                </div>


                <!-- Password Match Error -->

                <p
                    id="passwordError"
                    class="hidden text-sm text-red-600 mb-4"
                >

                    ⚠️ Passwords do not match.

                </p>


                <!-- Submit -->

                <button
                    type="submit"
                    class="w-full bg-blue-600
                           hover:bg-blue-700
                           text-white font-semibold
                           py-3 rounded-lg
                           transition duration-200
                           shadow-sm hover:shadow-md"
                >

                    Reset Password

                </button>


            </form>


            <!-- Back to Login -->

            <div class="text-center mt-6">


                <a
                    href="{{ url_for('login') }}"
                    class="text-sm text-blue-600
                           hover:text-blue-700
                           font-semibold hover:underline"
                >

                    ← Back to Login

                </a>


            </div>


        </div>


        <!-- Security Information -->

        <div class="flex items-center justify-center
                    gap-2 text-xs text-gray-400 mt-5">

            <span>🔒</span>

            <span>

                Your password is securely encrypted.

            </span>

        </div>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function validatePasswords() {

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirm_password").value;

            const error =
                document.getElementById("passwordError");


            if (password !== confirmPassword) {

                error.classList.remove("hidden");

                return false;

            }


            error.classList.add("hidden");

            return true;

        }

    </script>


</body>

</html>
